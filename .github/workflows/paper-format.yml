name: Awesome Paper Agent

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  add-paper:
    runs-on: ubuntu-latest
    if: >
      github.event.issue.pull_request == null &&
      (contains(github.event.comment.body || github.event.issue.body, 'awwm-paper') ||
      contains(github.event.comment.body || github.event.issue.body, 'arxiv.org/abs/'))
    steps:
      - uses: actions/checkout@v4

      - name: Add paper to README and open PR
        uses: actions/github-script@v7
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const paperAgent = require('./scripts/paper-agent.cjs');

            const body = process.env.COMMENT_BODY || process.env.ISSUE_BODY || '';
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const branchName = `paper-agent/issue-${issueNumber}`;

            const existingPRs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branchName}`,
              state: 'open',
            });
            if (existingPRs.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `An open paper-agent PR already exists for this issue: ${existingPRs.data[0].html_url}\n\n*Awesome Paper Agent*`,
              });
              return;
            }

            const readme = fs.readFileSync('README.md', 'utf8');
            const result = await paperAgent.applySubmission({ readme, body, fetch });

            if (result.errors.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: [
                  'Could not prepare a README entry from this issue.',
                  '',
                  ...result.errors.map(error => `- ${error}`),
                  '',
                  `Valid sections: ${result.sectionOptions}`,
                  '',
                  'Tip: use a fenced `awwm-paper` JSON block generated by `skills/add-paper/SKILL.md`.',
                  '',
                  '*Awesome Paper Agent*',
                ].join('\n'),
              });
              return;
            }

            if (result.added.length === 0) {
              const skipped = result.skipped.map(item => `- ${item.reason}`).join('\n') || '- No new entries were parsed.';
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: [
                  'No README changes were needed.',
                  '',
                  skipped,
                  '',
                  '*Awesome Paper Agent*',
                ].join('\n'),
              });
              return;
            }

            fs.writeFileSync('README.md', result.readme);

            execSync('git config user.name "Awesome Paper Agent"');
            execSync('git config user.email "paper-agent@users.noreply.github.com"');
            execSync(`git checkout -B ${branchName}`);
            execSync('git add README.md');
            execSync(`git commit -m "Add paper from #${issueNumber}"`);
            execSync(`git push --force origin HEAD:${branchName}`);

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Add paper: ${result.added[0].title}`,
              body: [
                `Closes #${issueNumber}`,
                '',
                '### Papers added',
                ...result.added.map(item => `- ${item.title} -> \`${item.sectionLabel}\``),
                '',
                '> Generated from an `awwm-paper` issue payload. Please review taxonomy placement and summary wording before merge.',
                '',
                '*Auto-generated by Awesome Paper Agent*',
              ].join('\n'),
              head: branchName,
              base: 'main',
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `PR opened: ${pr.data.html_url}\n\n*Awesome Paper Agent*`,
            });
